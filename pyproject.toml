[project]
name = "labkit"
version = "0.1.0"
description = "Controlled agent evaluation on Inspect AI: models x harnesses x tools x search, Apptainer sandbox"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.287",
    "inspect-swe>=0.2.72",
    "inspect-evals",
    "openai",
    "anthropic",
    "google-genai",
    "httpx",
    "pydantic>=2",
    "pyyaml",
]

[project.entry-points.inspect_ai]
labkit = "labkit._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labkit"]
